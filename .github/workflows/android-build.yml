name: Android Build, Sign & Release

on:
  push:
    branches: [ "main", "develop" ]
    tags:     [ "v*.*.*" ]           # Triggers Release job on semantic version tags
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish as GitHub Release"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS:  "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts','**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: chmod +x ./gradlew
      - uses: gradle/actions/wrapper-validation@v3

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/
          retention-days: 7

  # ── 2. Debug build (PRs / develop) ───────────────────────────────────────────
  build-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "${{ env.JAVA_VERSION }}", distribution: temurin, cache: gradle }
      - run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rnet-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ── 3. Release build (main branch + version tags + manual dispatch) ───────────
  build-release:
    name: Release APK (Signed)
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true')

    outputs:
      apk_path:    ${{ steps.locate.outputs.apk_path }}
      version_tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with: { java-version: "${{ env.JAVA_VERSION }}", distribution: temurin, cache: gradle }

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts','**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: chmod +x ./gradlew
      - uses: gradle/actions/wrapper-validation@v3

      # Decode signing keystore
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks

      # Determine version string from tag or commit
      - name: Determine version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="dev-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Build signed universal release APK
      - name: Assemble signed release APK
        env:
          KEYSTORE_PATH:     keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            --stacktrace

      # Rename APK to include version tag for clarity
      - name: Rename APK
        id: locate
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          DST="app/build/outputs/apk/release/rnet-${{ steps.version.outputs.tag }}-universal.apk"
          mv "$SRC" "$DST"
          echo "apk_path=$DST" >> "$GITHUB_OUTPUT"

      # Verify APK was produced and is not empty
      - name: Sanity-check APK
        run: |
          APK="${{ steps.locate.outputs.apk_path }}"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          [ "$SIZE" -gt 100000 ] || (echo "APK suspiciously small" && exit 1)

      # Upload as workflow artifact (always)
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rnet-release-${{ steps.version.outputs.tag }}
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 90

      # Clean keystore from runner disk
      - name: Clean up keystore
        if: always()
        run: rm -f keystore/release.jks

  # ── 4. GitHub Release (version tags only) ────────────────────────────────────
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write      # Required to create releases and upload assets

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Download the APK produced by the previous job
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: rnet-release-${{ needs.build-release.outputs.version_tag }}
          path: dist/

      # Generate changelog from git log since last tag
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -20)
          fi
          # Write to file to handle multiline safely
          echo "$LOG" > CHANGELOG_BODY.md
          echo "changelog_file=CHANGELOG_BODY.md" >> "$GITHUB_OUTPUT"

      # Create the GitHub Release and upload the APK as an asset
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       "RNET ${{ github.ref_name }}"
          body_path:  CHANGELOG_BODY.md
          draft:      false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files:      dist/rnet-${{ needs.build-release.outputs.version_tag }}-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
